name: iub_pay
description: IUB Cafeteria cashless ordering prototype (MOCK payments only).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^14.2.0
  dio: ^5.11.1
  intl: ^0.20.3
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
