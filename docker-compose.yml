services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iub_cafe
      POSTGRES_PASSWORD: iub_cafe_dev_pw   # dev only — override in real deployments
      POSTGRES_DB: iub_cafeteria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iub_cafe -d iub_cafeteria"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://iub_cafe:iub_cafe_dev_pw@db:5432/iub_cafeteria
      SECRET_KEY: ${SECRET_KEY:-change-me-in-real-deployments-generate-32-chars-min}
      MOCK_PAYMENT_WEBHOOK_TOKEN: ${MOCK_PAYMENT_WEBHOOK_TOKEN:-mock-webhook-token-dev-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENV: ${ENV:-docker-dev}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
