name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest httpx ruff black mypy
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Format check (black)
        working-directory: backend
        run: black --check .
      - name: Type check (mypy)
        working-directory: backend
        run: mypy app --ignore-missing-imports || true
      - name: Run tests
        working-directory: backend
        run: pytest -v
      - name: Docker build
        run: docker compose build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Flutter analyze
        working-directory: frontend
        # --no-fatal-infos prevents info-level lints (e.g. prefer_const_constructors)
        # from failing CI; warnings and errors still fail.
        run: flutter analyze --no-fatal-infos
      - name: Flutter test
        working-directory: frontend
        run: flutter test || echo "No tests yet"
